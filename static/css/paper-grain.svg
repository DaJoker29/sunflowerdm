<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384">
  <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity=".34"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".47"/>
</svg>
