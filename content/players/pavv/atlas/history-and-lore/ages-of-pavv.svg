<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title description">
  <title id="title">The Three Ages of Pavv</title>
  <desc id="description">First Age, Era of Creation, approximately 2,500 B.D. to 7 P.O. Second Age, Era of Discovery, 7 to 2356 P.O. Third Age, Era of Pilgrimage, 2356 P.O. to the present, shown as 3526 P.O. in the original timeline. The eras are displayed in order, not to scale.</desc>
  <rect width="1000" height="610" rx="20" fill="#14231b"/>
  <g font-family="Georgia, serif">
    <text x="42" y="60" fill="#f2c768" font-size="36">The Three Ages of Pavv</text>
    <path d="M66 105V516" fill="none" stroke="#615436" stroke-width="3"/>

    <rect x="103" y="102" width="855" height="125" rx="12" fill="#1b2c23"/>
    <circle cx="66" cy="164" r="11" fill="#b7ce9e"/>
    <text x="132" y="136" fill="#b7ce9e" font-size="21" font-family="Arial Narrow, Arial, sans-serif" letter-spacing="2">FIRST AGE</text>
    <text x="132" y="176" fill="#f6efdd" font-size="33">Era of Creation</text>
    <text x="132" y="209" fill="#cdc7b4" font-size="25">Approx. 2,500 B.D. – 7 P.O.</text>

    <rect x="103" y="245" width="855" height="125" rx="12" fill="#1b2c23"/>
    <circle cx="66" cy="307" r="11" fill="#f2c768"/>
    <text x="132" y="279" fill="#f2c768" font-size="21" font-family="Arial Narrow, Arial, sans-serif" letter-spacing="2">SECOND AGE</text>
    <text x="132" y="319" fill="#f6efdd" font-size="33">Era of Discovery</text>
    <text x="132" y="352" fill="#cdc7b4" font-size="25">7 P.O. – 2356 P.O.</text>

    <rect x="103" y="388" width="855" height="125" rx="12" fill="#112035"/>
    <circle cx="66" cy="450" r="11" fill="#9ab6e0"/>
    <text x="132" y="422" fill="#9ab6e0" font-size="21" font-family="Arial Narrow, Arial, sans-serif" letter-spacing="2">THIRD AGE</text>
    <text x="132" y="462" fill="#f6efdd" font-size="33">Era of Pilgrimage</text>
    <text x="132" y="495" fill="#cdc7b4" font-size="25">2356 P.O. – Present (3526 P.O.)</text>
    <text x="42" y="568" fill="#b7ce9e" font-size="22">B.D. · Before Disappearance     P.O. · Post-Obree</text>
  </g>
</svg>
