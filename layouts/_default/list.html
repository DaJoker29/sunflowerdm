{{ define "main" }}
  <header class="intro">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ with .Pages.ByWeight }}
    <ul class="entry-list" aria-label="Entries">
      {{ range . }}{{ partial "entry.html" . }}{{ end }}
    </ul>
  {{ else }}
    <p class="empty">Entries will appear here as they’re published.</p>
  {{ end }}
{{ end }}
