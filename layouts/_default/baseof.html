<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
      <nav aria-label="Main navigation">
        {{ $page := . }}
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ else if $page.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main id="main" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <span>{{ .Site.Title }}</span>
    {{ with .Site.GetPage "/support" }}<a href="{{ .RelPermalink }}">Support the compendium</a>{{ end }}
  </footer>
</body>
</html>
