{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<article>
	<header class="intro">
		<h1>{{ .Title }}</h1>{{ partial "page-badge.html" . }}
		{{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
		{{ if and .Section (not .Lastmod.IsZero) }}
			<p class="updated">Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "January 2, 2006" }}</time></p>
		{{ end }}
	</header>
	<div class="prose">{{ .Content }}</div>
</article>
{{ end }}
