<header class="site-sidebar">
  <div class="sidebar-heading">
    <a class="wordmark" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "favicon-48.png" | relURL }}" alt="" width="32" height="32">
      <span>{{ .Site.Title }}</span>
    </a>
  </div>
  <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
    <ul class="sidebar-links">
      {{ $current := . }}
      {{ range .Site.Menus.main }}
        {{ with .Page }}
          {{ partial "sidebar-item.html" (dict "item" . "current" $current "level" 1) }}
        {{ end }}
      {{ end }}
    </ul>
  </nav>
</header>
